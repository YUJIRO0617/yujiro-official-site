<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>ページが見つかりません | YUJIRO</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 7vw 80px;
            text-align: center;
        }
        .error-code {
            margin: 0;
            font-size: clamp(90px, 18vw, 190px);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: 0.03em;
        }
        .error-label {
            margin-top: 25px;
            font-size: 12px;
            letter-spacing: 0.35em;
        }
        .error-message {
            margin-top: 35px;
            font-size: 14px;
            line-height: 2;
            opacity: 0.7;
        }
        .error-home {
            display: inline-block;
            margin-top: 45px;
            padding: 14px 30px;
            border: 1px solid currentColor;
            font-size: 10px;
            letter-spacing: 0.2em;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .error-home:hover {
            background: #ffffff;
            color: #000000;
        }
        @media (max-width: 768px) {
            .error-page { padding: 100px 6vw 60px; }
            .error-message { font-size: 13px; }
        }
    </style>
</head>
<body>
    <main class="error-page">
        <p class="error-code">404</p>
        <p class="error-label">PAGE NOT FOUND</p>
        <p class="error-message">
            お探しのページは見つかりませんでした。<br>
            URLが間違っているか、ページが移動・削除された可能性があります。
        </p>
        <a href="/" class="error-home">BACK TO HOME</a>
    </main>
</body>
</html>
